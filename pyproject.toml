[project]
name = "peh-dataguard"
version = "0.7.0"
description = "A framework-agnostic data validation library for ensuring data quality and integrity"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Caio Mescouto Terra de Souza", email = "caio.mescouto@vito.be" }
]
requires-python = ">=3.11, <3.16"
# Upper bounds intentionally block next-minor releases; widen them after validation.
dependencies = [
    "pandera[polars]>=0.35.0,<0.36",
    "polars>=1.42.1,<2.2",
    # polars 1.x is broken on Python 3.15 (Series construction returns None).
    "polars>=2.0,<2.2; python_full_version >= '3.15'",
    "pydantic>=2.14.3,<2.15",
]
urls = { Homepage = "https://github.com/eu-parc/dataguard", Repository = "https://github.com/eu-parc/dataguard", Documentation = "https://eu-parc.github.io/dataguard/" }

[build-system]
requires = ["hatchling>=1.33.0,<1.34"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14,<6.171",
    "ipykernel>=7.4.0,<7.5",
    "pytest>=9.2.0,<9.3",
    "pytest-cov>=6.1.1,<7.2",
    "ruff>=0.17.3,<0.18",
]
docs = [
    "zensical>=0.0.74,<0.1",
    "mkdocstrings-python>=2.0.10,<2.1",
]

[tool.ruff]
line-length = 79
src = ["src/dataguard"]
extend-exclude = ["tests", "scripts", "notebooks", "data", "docs"]
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["F", "E", "W", "PL", "PT", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["dataguard"]
force-sort-within-sections = true

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = "."
#addopts = ["-p no:warnings"]
testpaths = ["tests/"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataguard"]
